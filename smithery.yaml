# Achriom MCP Server - Smithery Configuration
# https://smithery.ai/docs

name: achriom
displayName: Achriom
description: |
  The media memory layer for AI agents and their humans. Track, analyze, and get
  recommendations across books, movies, music, TV shows, and anime with an AI
  librarian that knows your taste.

# Achriom is a remote hosted server - not built/deployed by Smithery
runtime: remote

# Connection configuration
startCommand:
  type: http
  url: https://mcp.achriom.com/mcp

  # No user-provided config needed — auth is OAuth
  configSchema:
    type: object
    properties: {}
    required: []

# Authentication methods supported
authentication:
  oauth:
    supported: true
    provider: achriom
    authorize: "https://app.achriom.com/oauth/authorize"
    obtain: "Sign in with your Achriom account at app.achriom.com/mcp"

# Server capabilities
capabilities:
  tools: 29
  prompts: 10
  resources: true

# Categorization
categories:
  - media
  - productivity
  - entertainment
  - library
  - recommendations

tags:
  - books
  - movies
  - music
  - albums
  - tv-shows
  - anime
  - ai-librarian
  - collection-tracking
  - recommendations
  - apple-music
  - youtube

# Requirements
requirements:
  account: true
  subscription:
    required: false
    notes: "Free account required. MCP access included on all plans."
    free_tier: true

# Links
links:
  homepage: https://www.achriom.com
  documentation: https://www.achriom.com/mcp
  signup: https://app.achriom.com/signup
  support: mailto:hello@achriom.com
  repository: https://github.com/achriom/achriom-mcp

# Publisher info
publisher:
  name: Achriom
  url: https://www.achriom.com
  email: hello@achriom.com
